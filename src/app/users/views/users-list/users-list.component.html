<app-custom-table-data
  title="Usuarios"
  [totalRecords]="usersCount"
  [rowsPerPage]="rowsPerPage"
  [columns]="tableColumns"
  [data]="user$ | async"
  [lazy]="true"
  (onLazyLoad)="lazyLoadTable($event)"
  [canSearch]="true"
  [canUpdate]="true"
  (onCreate)="create()"
  (onUpdate)="update($event)"
  (onDelete)="delete($event)"
></app-custom-table-data>
