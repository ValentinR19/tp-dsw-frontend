<p-progressBar mode="indeterminate" [style]="{ height: '6px' }" *ngIf="viewLoading"></p-progressBar>
<div class="modal-body">
  {{ viewLoading ? waitMessage : confirmationMessage }}
</div>
<div class="modal-footer">
  <p-button label="Cancel" [styleClass]="'p-button-secondary'" (onClick)="cancelar()"></p-button>
  <p-button label="Delete" [styleClass]="'p-button-success'" (onClick)="eliminar()"></p-button>
</div>
