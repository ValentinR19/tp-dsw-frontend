<div class="login-wrapper">
  <!-- Lado izquierdo -->
  <div class="login-left">
    <div class="welcome-text">
      <h1>Bienvenido al <strong>CRM</strong></h1>
      <p>La herramienta definitiva para gestionar tu negocio con eficiencia.</p>
    </div>
  </div>

  <div class="login-right">
    <div class="login-card">
      <h2>Iniciar Sesión</h2>

      <form [formGroup]="loginForm" (ngSubmit)="submit()">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input
            id="username"
            pInputText
            type="text"
            formControlName="username"
            placeholder="Ej: jdoe"
            [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          />
          <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="invalid-feedback">El usuario es requerido.</div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            id="password"
            pInputText
            type="password"
            formControlName="password"
            placeholder="••••••••"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">La contraseña es requerida.</div>
        </div>

        <button type="submit" [disabled]="loading">
          <span *ngIf="!loading">Ingresar</span>
          <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
        </button>
      </form>
    </div>
  </div>
</div>
