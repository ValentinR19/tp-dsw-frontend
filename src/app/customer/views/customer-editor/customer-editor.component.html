<app-back-button (click)="close()"></app-back-button>

<div class="card">
  @if (!customerId) {
  <h2>Crear Cliente</h2>
  } @else {
  <h2>Editar Cliente{{ customer?.name }}</h2>
  }
</div>

<form [formGroup]="customerForm">
  <div class="grid">
    <div class="col-12 lg:col-6">
      <div class="card">
        <h3 class="text-800">Información básica</h3>
        <p-divider></p-divider>
        <p-iftalabel>
          <input id="name" type="text" pInputText formControlName="name" />
          <label for="name">Nombre</label>
        </p-iftalabel>
      </div>
      <div class="card">
        <h3 class="text-800">Categoria</h3>
        <p-select appendTo="body" dataKey="id" optionLabel="name" 
        [options]="customerCategories"
        formControlName="categories" 
        [virtualScroll]="true" 
        [virtualScrollItemSize]="40" 
        [filter]="true"
        [showClear]="true" 
        filterBy="name" 
        placeholder="Select Categories" 
        styleClass="w-full">
        </p-select>
      </div>
    </div>

  </div>
  <div class="btn-container">
    <p-button label="Guardar" (onClick)="submit()"></p-button>
  </div>
</form>
