<div class="app-layout" [class.sidebar-collapsed]="isSidebarCollapsed" [class.mobile]="isMobile" [class.mobile-sidebar-open]="isMobileSidebarOpen">
  <app-sidebar
    [collapsed]="isSidebarCollapsed"
    [mobile]="isMobile"
    [visible]="isMobileSidebarOpen"
    [class.visible]="isMobileSidebarOpen"
    (menuItemClicked)="onSidebarItemClick()"
  ></app-sidebar>
  <main class="app-content">
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>

    <app-footer></app-footer>
  </main>

  <div class="mobile-backdrop" *ngIf="isMobile && isMobileSidebarOpen" (click)="toggleSidebar()"></div>
</div>
