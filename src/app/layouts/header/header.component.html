<header class="app-header">
  <button class="menu-toggle-btn action-btn" aria-label="Abrir menú" (click)="toggleSidebar.emit()">
    <i class="pi pi-bars"></i>
  </button>
  <div class="app-header__logo">
    <span></span>
  </div>
  <div class="app-header__actions" *ngIf="authService.loggedUser$ | async as usuario">
    <ng-container>
      <div class="user-info">
        <span class="user-name">{{ usuario.fullName }}</span>
      </div>
    </ng-container>

    <div class="settings-dropdown">
      <button class="action-btn" aria-label="Settings" (click)="toggleSettingsDropdown()">
        <i class="pi pi-cog" style="font-size: 1rem"></i>
      </button>
      <div *ngIf="isSettingsDropdownOpen" class="dropdown-menu" #dropdownMenu>
        <div class="dropdown-header">
          <div class="user-avatar-wrapper">
            <img *ngIf="user?.image?.imageUrl" class="user-avatar" [src]="user?.image?.imageUrl" alt="{{ usuario.fullName }}" />
            <div *ngIf="!user?.image?.imageUrl" class="avatar-initials" [style.background]="getAvatarColor(usuario.fullName)">
              {{ getInitials(usuario.fullName) }}
            </div>
          </div>
          <div class="user-info">
            <div class="user-name">{{ usuario.fullName }}</div>
            <div class="user-email">{{ user.email }}</div>
          </div>
        </div>

        <hr class="dropdown-divider" />

         <!-- <button class="dropdown-item"><i class="pi pi-bolt"></i> Mejora</button> (Para hacer despues en AD)-->

        <button class="dropdown-item" (click)="updateProfile()"><i class="pi pi-user-edit"></i> Configuraciones de la cuenta</button>

        <hr class="dropdown-divider" />

        <!-- <button class="dropdown-item"><i class="pi pi-comments"></i> Chatea con nosotros</button> (Para hacer despues en AD)-->

        <button class="dropdown-item" (click)="logout()"><i class="pi pi-sign-out"></i> Finalizar la sesión</button>
      </div>
    </div>
  </div>
</header>
