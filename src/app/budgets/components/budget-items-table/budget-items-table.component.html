<div class="card">
  <div class="flex justify-content-between align-items-center mb-2">
    <h3 class="text-800">Items del presupuesto</h3>
    <p-button label="Agregar producto" icon="pi pi-plus" (onClick)="openSearch.emit()"></p-button>
  </div>

  <p-table [value]="items.controls" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Precio Unitario</th>
        <th>Descuento (%)</th>
        <th>Subtotal</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row let-rowIndex="rowIndex">
      <tr [formGroup]="row">

        <td>{{ row.value.productName }}</td>

        <td>
          <p-inputNumber formControlName="quantity" (onInput)="updateItemTotal(row)" [min]="1" inputId="quantity-{{ rowIndex }}" class="w-6rem"></p-inputNumber>
        </td>

        <td>
          <p-inputNumber formControlName="unitPrice" mode="currency" currency="ARS" [disabled]="true" class="w-8rem"></p-inputNumber>
        </td>


        <td>
          <p-inputNumber formControlName="discountPercent" suffix="%" [min]="0" [max]="100" (onInput)="updateItemTotal(row)" class="w-6rem"></p-inputNumber>
        </td>

        <td>{{ row.value.totalLine | currency: 'ARS' }}</td>

        <td>
          <p-button icon="pi pi-trash" severity="danger" (onClick)="removeItem(rowIndex)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
