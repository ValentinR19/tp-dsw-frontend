<app-custom-table-data
  title="Presupuestos"
  [totalRecords]="count"
  [columns]="budgetColumns"
  [data]="budget$ | async"
  [lazy]="true"
  (onLazyLoad)="lazyLoadTable($event)"
  [canSearch]="true"
  [canUpdate]="true"
  [canDelete]="false"
  (onCreate)="onCreateBudget()"
  (onUpdate)="onEdit($event)"
  [totalRecords]="count"
></app-custom-table-data>
